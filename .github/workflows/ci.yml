name: PAESTRO CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 안전 분류 회귀 테스트 (safety)
        run: python enrich/test_safety.py

      - name: 매니페스트 계약 검증 (schemas)
        run: python schemas/validate.py

      - name: 오프라인 파이프라인 스모크 (ingest→검증)
        run: python demo/pipeline.py

      - name: 검색 회귀 테스트 (eval)
        run: python eval/regression.py
