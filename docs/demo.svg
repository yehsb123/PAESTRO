<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'SFMono-Regular',Consolas,'D2Coding','Menlo','Malgun Gothic',monospace" font-size="14">
  <style>
    .bg{fill:#16161e}
    .bar{fill:#22222c}
    .txt{fill:#d7dae0}
    .dim{fill:#7f848e}
    .prompt{fill:#27c93f;font-weight:700}
    .cmd{fill:#e6e6e6;font-weight:700}
    .str{fill:#e5c07b}
    .head{fill:#56b6c2}
    .arrow{fill:#98c379}
    .warn{fill:#e5c07b;font-weight:700}
    .num{fill:#61afef}
  </style>

  <rect class="bg" x="0" y="0" width="860" height="540" rx="10"/>
  <rect class="bar" x="0" y="0" width="860" height="34" rx="10"/>
  <rect class="bar" x="0" y="20" width="860" height="14"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" class="dim" font-size="12.5">PAESTRO — 의미로 도구를 고르는 터미널</text>

  <!-- ① 단일 검색 -->
  <text x="20" y="60"><tspan class="prompt">$ </tspan><tspan class="cmd">pae s </tspan><tspan class="str">"린트 에러 자동으로 고쳐줘"</tspan></text>
  <text x="20" y="86" class="head">"린트 에러 자동으로 고쳐줘" — 어떤 걸로 할까요?  (레지스트리 1955개)</text>
  <text x="36" y="110"><tspan class="num">1.</tspan> <tspan class="txt">Fix all auto-fixable Problems</tspan></text>
  <text x="840" y="110" text-anchor="end" class="dim">[vscode.eslint]</text>
  <text x="36" y="132"><tspan class="num">2.</tspan> <tspan class="txt">Validation of .gitlab-ci.yml content</tspan></text>
  <text x="840" y="132" text-anchor="end" class="dim">[rest.gitlab]</text>
  <text x="36" y="154"><tspan class="num">3.</tspan> <tspan class="txt">Generate Commit Message</tspan></text>
  <text x="840" y="154" text-anchor="end" class="dim">[vscode.gitlens]</text>
  <text x="36" y="176"><tspan class="num">4.</tspan> <tspan class="txt">Create ESLint configuration</tspan></text>
  <text x="840" y="176" text-anchor="end" class="dim">[vscode.eslint]</text>
  <text x="36" y="198"><tspan class="num">5.</tspan> <tspan class="dim">직접 지정 / 설정…</tspan></text>

  <!-- ② 복합 오케스트레이션 -->
  <text x="20" y="244"><tspan class="prompt">$ </tspan><tspan class="cmd">pae o </tspan><tspan class="str">"저장소 복제하고 브랜치 삭제"</tspan></text>
  <text x="20" y="270" class="dim">→ 2단계 분해 · 레지스트리 1955개에서 계획</text>

  <text x="36" y="298"><tspan class="num">1.</tspan> <tspan class="txt">저장소 복제</tspan></text>
  <text x="56" y="320"><tspan class="arrow">→ Clone a repository into a new directory</tspan></text>
  <text x="840" y="320" text-anchor="end" class="dim">[cli]</text>
  <text x="36" y="348"><tspan class="num">2.</tspan> <tspan class="txt">브랜치 삭제</tspan></text>
  <text x="56" y="370"><tspan class="arrow">→ Git Delete Branch...</tspan></text>
  <text x="840" y="370" text-anchor="end"><tspan class="dim">[vscode]  </tspan><tspan class="warn">⚠ 승인 필요</tspan></text>

  <text x="20" y="410"><tspan class="txt">실행 계획: 2/2단계 · </tspan><tspan class="warn">승인 필요 1건 ⚠</tspan></text>

  <!-- 요약 배너 -->
  <rect x="20" y="440" width="820" height="78" rx="8" fill="#1c1c26" stroke="#2c2c3a"/>
  <text x="36" y="466" class="head" font-size="13">왜 유용한가</text>
  <text x="36" y="488" class="txt" font-size="12.5">· 도구 이름을 몰라도 <tspan class="str">한국어로 뜻만</tspan> 말하면 1,955개 중 맞는 도구를 골라준다</text>
  <text x="36" y="508" class="txt" font-size="12.5">· 복합 요청은 <tspan class="arrow">단계로 분해·계획</tspan>하고, 되돌릴 수 없는 작업엔 <tspan class="warn">⚠ 승인</tspan>을 붙인다</text>
</svg>
